name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # 项目为 Windows 专属 (ctypes 内存读取 / nvidia-smi / ffmpeg 路径), 必须在 Windows runner 上测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies (uv.lock)
        run: uv sync --frozen

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests
