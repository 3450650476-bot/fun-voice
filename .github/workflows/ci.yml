name: CI

on:
  push:
  pull_request:
  # 允许在 Actions 页面手动触发 (Run workflow 按钮)
  workflow_dispatch:

jobs:
  test:
    # 项目为 Windows 专属 (ctypes 内存读取 / nvidia-smi / ffmpeg 路径), 必须在 Windows runner 上测试
    runs-on: windows-latest
    timeout-minutes: 30   # 防依赖安装/测试异常挂死 (默认 6h 太长)
    steps:
      - uses: actions/checkout@v5

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies, skip GPU torch (cu128 wheel is 3.3GB, tests are all mocks)
        run: uv sync --frozen --no-install-package torch --no-install-package torchaudio

      - name: Install CPU torch (small ~200MB; tests never touch CUDA)
        run: uv pip install torch==2.8.0+cpu torchaudio==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu

      - name: "Run unit tests (--no-sync: keep the CPU torch just installed, skip uv re-sync)"
        run: uv run --no-sync python -m unittest discover -s tests
        env:
          # 强制 UTF-8 输出: 中文日志在 cp1252 控制台会 UnicodeEncodeError (app/__init__.py 已兜底 replace)
          PYTHONUTF8: "1"
