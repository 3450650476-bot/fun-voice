name: CI

on:
  push:
  pull_request:
  # 允许在 Actions 页面手动触发 (Run workflow 按钮)
  workflow_dispatch:

jobs:
  test:
    # 项目为 Windows 专属 (ctypes 内存读取 / nvidia-smi / ffmpeg 路径), 必须在 Windows runner 上测试
    runs-on: windows-latest
    timeout-minutes: 30   # 防依赖安装/测试异常挂死 (默认 6h 太长)
    steps:
      - uses: actions/checkout@v5

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies, skip GPU torch (cu128 wheel is 3.3GB, tests are all mocks)
        run: uv sync --frozen --no-install-package torch --no-install-package torchaudio

      - name: Install CPU torch (small ~200MB; tests never touch CUDA)
        run: uv pip install torch==2.8.0+cpu torchaudio==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu

      - name: Diagnostic — torch version & separator tests (isolate KeyboardInterrupt)
        run: |
          uv run --no-sync python -c "import torch, sys; print('python', sys.version.split()[0]); print('torch', torch.__version__)"
          uv run --no-sync python -m unittest tests.test_separator -v
        env:
          PYTHONUTF8: "1"

      # 拆分测试为短步骤: 长单步骤在 GitHub Actions Windows runner 上偶发 Ctrl+C (KeyboardInterrupt),
      # 拆短后不再触发, 且失败能精确定位到模块
      - name: "Test A: align+asr+audio"
        run: uv run --no-sync python -m unittest tests.test_align tests.test_asr tests.test_audio
        timeout-minutes: 5
        env:
          PYTHONUTF8: "1"

      - name: "Test B1: pipeline"
        run: uv run --no-sync python -m unittest tests.test_pipeline
        timeout-minutes: 5
        env:
          PYTHONUTF8: "1"

      - name: "Test B2: resume"
        run: uv run --no-sync python -m unittest tests.test_resume
        timeout-minutes: 5
        env:
          PYTHONUTF8: "1"

      - name: "Test C: separator+translator+tts"
        run: uv run --no-sync python -m unittest tests.test_separator tests.test_translator tests.test_tts
        timeout-minutes: 5
        env:
          PYTHONUTF8: "1"

      - name: "Test D: ui"
        run: uv run --no-sync python -m unittest tests.test_ui
        timeout-minutes: 5
        env:
          PYTHONUTF8: "1"
